# 请自行提供有效证书、修改域名；不要覆盖已有站点。
server {
    listen 443 ssl;
    server_name mfi.example.com;
    ssl_certificate /etc/letsencrypt/live/mfi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mfi.example.com/privkey.pem;
    client_max_body_size 8k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    # 公网直连，Nginx在USB宿主机运行：127.0.0.1:8787
    # SSH中转，Nginx在中转机运行：改成127.0.0.1:18787（两处都改）
    location /mfi/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        access_log off;
    }
}
