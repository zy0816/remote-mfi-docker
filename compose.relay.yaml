services:
  mfi:
    environment:
      # 按docs/remote.md设置，不要照抄示例地址。
      RELAY_SSH_HOST: relay.example.com
      RELAY_SSH_PORT: '22'
      RELAY_SSH_USER: mfi-tunnel
      RELAY_REMOTE_PORT: '18787'
    volumes:
      - type: bind
        source: ./secrets/relay_ssh_key
        target: /run/secrets/relay_ssh_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/relay_known_hosts
        target: /run/secrets/relay_known_hosts
        read_only: true
        bind:
          create_host_path: false
