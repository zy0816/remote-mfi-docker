services:
  mfi:
    image: remote-mfi:1.0.2
    # 先导入离线镜像；不拉取、不构建，避免在NAS下载apt/pip依赖。
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      MFI_AUTH_TOKEN: "CHANGE_ME"
      MFI_BIND_HOST: 0.0.0.0
      MFI_BIND_PORT: '8787'
      MFI_LOG_LEVEL: INFO
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rw'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
