name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: sh -n docker-entrypoint.sh
      - name: Validate Compose without displaying configuration
        env:
          MFI_AUTH_TOKEN: EXAMPLE_ONLY_FOR_CI_NOT_A_REAL_SECRET_123456
          RELAY_SSH_HOST: relay.example.com
          RELAY_SSH_USER: mfi-tunnel
        run: |
          docker compose -f compose.yaml -f compose.direct.yaml config --quiet
          docker compose -f compose.yaml -f compose.relay.yaml config --quiet
