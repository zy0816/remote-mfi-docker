name: Tests
on:
  push:
    branches: [main, streamline-v1.0.2]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: sh -n docker-entrypoint.sh
      - name: Validate Compose without displaying configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.armv7.yaml config --quiet
          docker compose -f compose.yaml -f compose.relay.yaml config --quiet
  docker-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build x86 runtime without compilers
        run: docker build --platform linux/amd64 -t remote-mfi:ci .
      - name: Check imports and absence of gcc
        run: |
          docker run --rm --entrypoint sh remote-mfi:ci -c 'test -z "$(command -v gcc)" && python -c "import usb.core,cryptography,cffi; print(cryptography.__version__,cffi.__version__)"'
      - name: Default token must fail closed
        run: |
          set +e
          output=$(docker run --rm -e MFI_AUTH_TOKEN=CHANGE_ME remote-mfi:ci 2>&1)
          result=$?
          set -e
          test "$result" -ne 0
          printf '%s' "$output" | grep -q 'MFI_AUTH_TOKEN'
